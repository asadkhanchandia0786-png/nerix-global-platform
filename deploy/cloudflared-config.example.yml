# /etc/cloudflared/config.yml — replace the tunnel id and credentials path with the values `cloudflared tunnel create` prints.
tunnel: REPLACE-WITH-TUNNEL-ID
credentials-file: /etc/cloudflared/REPLACE-WITH-TUNNEL-ID.json
ingress:
  - hostname: app.nerixglobal.com
    service: http://127.0.0.1:3000
  - service: http_status:404
